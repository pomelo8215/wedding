<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>周佑澤 &amp; 楊孟萍 婚禮邀請函 | 2027.04.03</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sun-terracotta: #d4a373;
      --sun-terracotta-dark: #b98552;
      --morandi-sage: #8da399;
      --morandi-sage-dark: #6f867b;
      --bg-cream: #faf7f2;
      --bg-warm: #f4efe6;
      --text-ink: #3c3834;
      --text-muted: #766f68;
      --card-white: rgba(255, 255, 255, 0.94);
      --border-soft: rgba(212, 163, 115, 0.28);
      --shadow-soft: 0 14px 36px rgba(60, 56, 52, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: 'Noto Serif TC', serif;
      background-color: var(--bg-cream);
      color: var(--text-ink);
      line-height: 1.8;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .en-font {
      font-family: 'Cormorant Garamond', serif;
      letter-spacing: 0.08em;
    }

    /* 手機版關鍵詞與地點防斷行 */
    .no-wrap {
      white-space: nowrap;
      display: inline-block;
    }

    /* 1. 頂端固定毛玻璃質感導航列 */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(250, 247, 242, 0.74);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(212, 163, 115, 0.22);
      transition: background 0.3s ease;
    }

    .nav-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0.9rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-ink);
      text-decoration: none;
      letter-spacing: 0.14em;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-ink);
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      position: relative;
      padding-bottom: 4px;
      transition: color 0.3s ease;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1.5px;
      background-color: var(--sun-terracotta);
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--sun-terracotta-dark);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* 全螢幕封面背景（文字置於底部安全區，不遮擋臉部） */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 620px;
      background-image: url('https://i.postimg.cc/cCx5NqgQ/IMG-117.jpg');
      background-size: cover;
      background-position: center 22%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      text-align: center;
      padding: 0 1.25rem 4.2rem;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(32, 28, 25, 0.08) 0%,
        rgba(32, 28, 25, 0.04) 48%,
        rgba(32, 28, 25, 0.56) 78%,
        rgba(28, 24, 21, 0.82) 100%
      );
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      color: #ffffff;
      max-width: 680px;
      animation: fadeUp 1.1s ease-out both;
    }

    .hero-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #f3dcc4;
      margin-bottom: 0.65rem;
    }

    .hero-names {
      font-size: clamp(2rem, 6vw, 3.1rem);
      font-weight: 500;
      letter-spacing: 0.22em;
      margin-bottom: 0.75rem;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
    }

    .hero-names span.amp {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--sun-terracotta);
      margin: 0 0.35em;
    }

    .hero-date {
      font-size: 1.08rem;
      letter-spacing: 0.24em;
      color: rgba(255, 255, 255, 0.92);
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      border-bottom: 1px solid rgba(255, 255, 255, 0.35);
      display: inline-block;
      padding: 0.4rem 1.4rem;
    }

    /* 通用區塊容器 */
    section {
      padding: 5.5rem 1.25rem;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    .section-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-en {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--morandi-sage-dark);
      margin-bottom: 0.35rem;
    }

    .section-title {
      font-size: 1.85rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      color: var(--text-ink);
    }

    .section-divider {
      width: 48px;
      height: 1.5px;
      background: linear-gradient(90deg, var(--sun-terracotta), var(--morandi-sage));
      margin: 1rem auto 0;
    }

    /* 關於我們 & 2. 藝術感倒數計時器 */
    #about {
      background-color: var(--bg-cream);
    }

    .invitation-prose {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 3.2rem;
      color: var(--text-muted);
      font-size: 1.02rem;
      line-height: 2.1;
    }

    .countdown-wrapper {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      max-width: 640px;
      margin: 0 auto;
    }

    .countdown-card {
      background: linear-gradient(145deg, #ffffff 0%, #fcfaf6 100%);
      border: 1px solid rgba(212, 163, 115, 0.24);
      border-radius: 18px;
      padding: 1.35rem 0.6rem;
      box-shadow: 0 12px 30px rgba(212, 163, 115, 0.14), 0 4px 12px rgba(60, 56, 52, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .countdown-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--sun-terracotta), var(--morandi-sage));
      opacity: 0.75;
    }

    .countdown-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 600;
      color: var(--sun-terracotta-dark);
      line-height: 1.1;
    }

    .countdown-hairline {
      width: 1px;
      height: 14px;
      background-color: rgba(141, 163, 153, 0.55);
      margin: 0.5rem 0;
    }

    .countdown-unit {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--morandi-sage-dark);
    }

    /* 3 & 7. 婚禮詳情：垂直 V-Card 設計與獨立摺疊交通面板 */
    #details {
      background-color: var(--bg-warm);
    }

    .vcard-stack {
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
    }

    .vcard-group {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .vcard {
      background: var(--card-white);
      border-radius: 22px;
      padding: 2.3rem 1.8rem;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-soft);
      text-align: center;
      position: relative;
    }

    .vcard-badge {
      display: inline-block;
      padding: 0.28rem 1.05rem;
      border-radius: 999px;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      margin-bottom: 0.9rem;
    }

    .badge-church {
      background-color: rgba(141, 163, 153, 0.16);
      color: var(--morandi-sage-dark);
    }

    .badge-banquet {
      background-color: rgba(212, 163, 115, 0.18);
      color: var(--sun-terracotta-dark);
    }

    .vcard-title {
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      margin-bottom: 1.25rem;
      color: var(--text-ink);
    }

    .vcard-meta {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      font-size: 0.98rem;
      color: var(--text-muted);
    }

    .vcard-meta strong {
      color: var(--text-ink);
      font-weight: 500;
    }

    .map-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 1.35rem;
      padding: 0.52rem 1.3rem;
      border-radius: 999px;
      border: 1px solid var(--sun-terracotta);
      color: var(--sun-terracotta-dark);
      text-decoration: none;
      font-size: 0.88rem;
      letter-spacing: 0.08em;
      transition: all 0.25s ease;
    }

    .map-link:hover {
      background-color: var(--sun-terracotta);
      color: #ffffff;
    }

    .accordion-item {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(141, 163, 153, 0.32);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(60, 56, 52, 0.04);
    }

    .accordion-trigger {
      width: 100%;
      background: transparent;
      border: none;
      padding: 1rem 1.4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-family: 'Noto Serif TC', serif;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-ink);
      letter-spacing: 0.08em;
      text-align: left;
      transition: background 0.25s ease;
    }

    .accordion-trigger:hover {
      background: rgba(141, 163, 153, 0.08);
    }

    .accordion-icon {
      width: 22px;
